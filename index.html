<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown the Winner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14;
    --bg2:#0e1220;
    --panel:#141a26;
    --panel2:#1a2233;
    --line:rgba(212,175,60,0.16);
    --gold:#d4af3c;
    --gold-hi:#f3d878;
    --crimson:#c1443c;
    --text:#eeebe1;
    --muted:#8b93a7;
    --good:#5fbf85;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(212,175,60,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .display{font-family:'Anton',sans-serif; letter-spacing:0.02em;}
  ::selection{background:var(--gold); color:#1a1200;}

  /* header */
  header{
    padding:36px 18px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  header h1{
    font-size:clamp(28px,7vw,44px);
    margin:0 0 8px;
    text-transform:uppercase;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#a97f22);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted); margin:0; font-size:14px; max-width:420px; margin:0 auto;}
  .admin-bar{
    display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:9px 16px; border-radius:8px; cursor:pointer; letter-spacing:0.02em;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#211703; border:none;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-crimson{background:var(--crimson); border:none; color:#fff;}
  .btn-ghost{background:transparent;}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn-sm{padding:6px 11px; font-size:12px;}

  .admin-pill{
    font-size:11px; color:var(--gold); border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; display:inline-block; margin-top:10px; letter-spacing:.04em;
  }

  main{max-width:640px; margin:0 auto; padding:22px 14px;}

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:16px;
    margin-bottom:22px;
    overflow:hidden;
    position:relative;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 10px;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.12em; color:var(--gold); font-weight:700; text-transform:uppercase;
  }
  .title-row{display:flex; align-items:center; gap:8px; flex:1;}
  .card-title{
    font-size:19px; font-weight:800; margin:2px 0 0;
  }
  .title-input{
    background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--text);
    font-size:17px; font-weight:800; font-family:'Inter',sans-serif; width:100%; padding:2px 0;
  }
  .title-input:focus{outline:none; border-bottom-color:var(--gold);}

  .status-strip{
    padding:8px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .countdown{color:var(--gold-hi); font-weight:700; font-variant-numeric:tabular-nums;}
  .tag{
    font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:800;
    padding:3px 8px; border-radius:999px;
  }
  .tag-setup{background:rgba(139,147,167,.18); color:var(--muted);}
  .tag-live{background:rgba(95,191,133,.15); color:var(--good);}
  .tag-ended{background:rgba(212,175,60,.18); color:var(--gold-hi);}

  .duel{
    display:flex; flex-direction:column; gap:0; position:relative;
  }
  .side{
    padding:16px; display:flex; flex-direction:column; gap:8px; position:relative;
  }
  .side-a{border-bottom:1px solid var(--line);}

  .vs-badge{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 60%, #8a661c);
    color:#1a1200; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:13px; z-index:3;
    box-shadow:0 0 0 4px var(--bg2), 0 2px 10px rgba(0,0,0,.4);
  }

  .photo-wrap{
    width:100%; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
    background:var(--bg2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-placeholder{color:var(--muted); font-size:12px; text-align:center; padding:10px;}
  .upload-btn{
    position:absolute; bottom:8px; right:8px; font-size:11px; background:rgba(0,0,0,.55);
    color:#fff; border:1px solid rgba(255,255,255,.2); padding:5px 9px; border-radius:7px; cursor:pointer;
  }
  input[type=file]{display:none;}

  .name-input, .detail-input{
    background:var(--bg2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-family:'Inter',sans-serif;
  }
  .name-input{font-weight:700; font-size:15px;}
  .detail-input{font-size:13px; resize:vertical; min-height:52px; line-height:1.4;}

  .name-display{font-weight:800; font-size:16px; margin:0;}
  .detail-display{font-size:13px; color:var(--muted); line-height:1.45; margin:0; white-space:pre-wrap;}

  .vote-row{display:flex; align-items:center; gap:10px; margin-top:2px;}
  .vote-btn{
    flex:1; padding:11px 10px; border-radius:9px; border:none; cursor:pointer;
    font-weight:800; font-size:13px; letter-spacing:.02em;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#211703;
  }
  .vote-btn.voted{background:var(--panel2); color:var(--good); border:1px solid var(--good);}
  .vote-btn:disabled{opacity:.5; cursor:not-allowed;}
  .vote-count{font-size:12px; color:var(--muted); min-width:64px; text-align:right;}
  .bar-track{height:6px; border-radius:99px; background:var(--bg2); overflow:hidden; margin-top:2px;}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-hi)); transition:width .4s ease;}

  /* setup controls (admin) */
  .setup-box{padding:14px 16px; border-top:1px solid var(--line);}
  .setup-label{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .dur-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .dur-input{
    width:70px; background:var(--bg2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px; font-size:13px;
  }

  /* winner reveal */
  .crowned{
    padding:22px 16px 26px; text-align:center; position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 300px 200px at 50% 0%, rgba(212,175,60,.28), transparent 70%),
      var(--panel);
  }
  .crown-icon{width:46px; height:46px; margin:0 auto 6px;}
  .king-photo{
    width:180px; height:180px; border-radius:50%; object-fit:cover; margin:6px auto 14px;
    border:4px solid var(--gold); box-shadow:0 0 0 6px rgba(212,175,60,.15), 0 10px 30px rgba(0,0,0,.5);
  }
  .king-stamp{
    display:inline-block; font-family:'Anton',sans-serif; font-size:26px; letter-spacing:.06em;
    color:#1a1200; background:linear-gradient(180deg,var(--gold-hi),var(--gold));
    padding:6px 22px; border-radius:6px; transform:rotate(-3deg);
    box-shadow:0 6px 18px rgba(212,175,60,.35);
    margin-bottom:10px;
  }
  .king-name{font-size:20px; font-weight:800; margin:4px 0 2px;}
  .king-detail{font-size:13px; color:var(--muted); max-width:340px; margin:0 auto 10px;}
  .king-score{font-size:12px; color:var(--gold-hi); font-weight:700;}
  .runner-up{font-size:11px; color:var(--muted); margin-top:14px;}

  footer{text-align:center; color:var(--muted); font-size:11px; padding:20px; opacity:.7;}

  @media(min-width:640px){
    .duel{flex-direction:row;}
    .side-a{border-bottom:none; border-right:1px solid var(--line);}
    .side{flex:1;}
  }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--gold); color:var(--text);
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow" style="opacity:.8">FIVE BATTLES · YOUR VOTE DECIDES</div>
  <h1>Crown the Winner</h1>
  <p>Add two contenders to each battle, start the clock, and let votes settle who wears the crown.</p>
  <div class="admin-bar">
    <button class="btn btn-ghost" id="adminToggle">🔒 Admin</button>
  </div>
  <div id="adminPillWrap"></div>
</header>

<main id="app"></main>

<footer>Votes and battle data are shared and update live for everyone viewing this page.</footer>
<div class="toast" id="toast"></div>

<script>
const NUM_BATTLES = 5;
const ADMIN_PASSWORD = 'crown2026';
let isAdmin = false;
let battles = [];      // in-memory battle state, index 0..NUM_BATTLES-1
let votedMap = {};      // battleIndex -> 'a'|'b'|null
let tickHandle = null;

function defaultBattle(i){
  return {
    title: 'Battle ' + (i+1),
    a: { name:'', detail:'', image:'', votes:0 },
    b: { name:'', detail:'', image:'', votes:0 },
    endTime: null // ms epoch when voting ends; null = not started
  };
}

async function sGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{
    await window.storage.set(key, JSON.stringify(value), shared);
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function fmtCountdown(ms){
  if(ms <= 0) return '0:00:00';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400);
  const h = Math.floor((s%86400)/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  const pad = n => String(n).padStart(2,'0');
  if(d > 0) return d + 'd ' + pad(h) + ':' + pad(m) + ':' + pad(sec);
  return pad(h) + ':' + pad(m) + ':' + pad(sec);
}

function resizeImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function init(){
  const loads = [];
  for(let i=0;i<NUM_BATTLES;i++){
    loads.push(sGet('battle_'+i, true).then(v => battles[i] = v || defaultBattle(i)));
    loads.push(sGet('voted_'+i, false).then(v => votedMap[i] = v));
  }
  await Promise.all(loads);
  renderAll();
  startTicker();
  pollLoop();
}

function startTicker(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(()=>{
    battles.forEach((b, i)=>{
      if(b.endTime){
        const remain = b.endTime - Date.now();
        const el = document.getElementById('cd-'+i);
        if(remain > 0){
          if(el) el.textContent = 'Ends in ' + fmtCountdown(remain);
        } else {
          // just crossed the finish line
          if(el && !el.dataset.ended){
            el.dataset.ended = '1';
            updateCard(i);
          }
        }
      }
    });
  }, 1000);
}

function pollLoop(){
  setInterval(async ()=>{
    for(let i=0;i<NUM_BATTLES;i++){
      const active = document.activeElement;
      const withinCard = active && active.closest && active.closest('[data-card="'+i+'"]');
      if(withinCard) continue; // don't clobber a battle the admin is editing right now
      const remote = await sGet('battle_'+i, true);
      if(remote && JSON.stringify(remote) !== JSON.stringify(battles[i])){
        battles[i] = remote;
        updateCard(i);
      }
    }
  }, 4000);
}

function battleStatus(b){
  if(!b.endTime) return 'setup';
  return (b.endTime - Date.now() > 0) ? 'live' : 'ended';
}

function pct(a, b){
  const total = a + b;
  if(total === 0) return [50,50];
  return [Math.round(a/total*100), Math.round(b/total*100)];
}

function sideBlock(i, side, b, status){
  const c = b[side];
  const label = side === 'a' ? 'A' : 'B';
  const voted = votedMap[i];
  const photo = c.image
    ? `<img src="${c.image}" alt="${escapeHtml(c.name||'')}">`
    : `<div class="photo-placeholder">No photo yet</div>`;

  const uploadBtn = isAdmin
    ? `<label class="upload-btn">📷 Photo<input type="file" accept="image/*" data-action="upload" data-battle="${i}" data-side="${side}"></label>`
    : '';

  const nameBlock = isAdmin
    ? `<input class="name-input" placeholder="Name / title" value="${escapeAttr(c.name)}" data-field="name" data-battle="${i}" data-side="${side}">
       <textarea class="detail-input" placeholder="Short description or details" data-field="detail" data-battle="${i}" data-side="${side}">${escapeHtml(c.detail)}</textarea>`
    : `<p class="name-display">${escapeHtml(c.name || 'Unnamed')}</p>
       ${c.detail ? `<p class="detail-display">${escapeHtml(c.detail)}</p>` : ''}`;

  const [pa, pb] = pct(b.a.votes, b.b.votes);
  const myPct = side === 'a' ? pa : pb;

  let voteRow = '';
  if(status === 'live'){
    const already = voted === side;
    const disabled = !!voted;
    voteRow = `
      <div class="vote-row">
        <button class="vote-btn ${already ? 'voted':''}" data-action="vote" data-battle="${i}" data-side="${side}" ${disabled?'disabled':''}>
          ${already ? '✓ Voted' : 'Vote ' + label}
        </button>
        <div class="vote-count">${c.votes} vote${c.votes===1?'':'s'}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${myPct}%"></div></div>
    `;
  } else if(status === 'setup'){
    voteRow = `<div class="vote-count" style="text-align:left; margin-top:2px;">Voting opens once the battle starts</div>`;
  }

  return `
    <div class="side ${side==='a'?'side-a':''}">
      <div class="photo-wrap">${photo}${uploadBtn}</div>
      ${nameBlock}
      ${voteRow}
    </div>
  `;
}

function crownedBlock(b){
  const aWins = b.a.votes > b.b.votes;
  const bWins = b.b.votes > b.a.votes;
  const tie = b.a.votes === b.b.votes;
  const winner = tie ? null : (aWins ? b.a : b.b);
  const loser = tie ? null : (aWins ? b.b : b.a);

  if(tie){
    return `
      <div class="crowned">
        <div class="king-stamp">DRAW</div>
        <p class="king-detail">${b.a.votes} vs ${b.b.votes} votes — it's a tie between ${escapeHtml(b.a.name||'A')} and ${escapeHtml(b.b.name||'B')}.</p>
      </div>
    `;
  }

  return `
    <div class="crowned">
      <svg class="crown-icon" viewBox="0 0 64 64" fill="none">
        <path d="M6 44 L2 20 L18 32 L32 10 L46 32 L62 20 L58 44 Z" fill="url(#g)" stroke="#a97f22" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="32" cy="8" r="3" fill="#f3d878"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3d878"/><stop offset="1" stop-color="#d4af3c"/>
        </linearGradient></defs>
      </svg>
      ${winner.image ? `<img class="king-photo" src="${winner.image}" alt="${escapeHtml(winner.name)}">` : ''}
      <div class="king-stamp">CROWNED</div>
      <p class="king-name">${escapeHtml(winner.name || 'Winner')}</p>
      ${winner.detail ? `<p class="king-detail">${escapeHtml(winner.detail)}</p>` : ''}
      <p class="king-score">${winner.votes} votes vs ${loser.votes}</p>
      <p class="runner-up">Runner-up: ${escapeHtml(loser.name || '—')}</p>
    </div>
  `;
}

function setupControls(i){
  return `
    <div class="setup-box">
      <div class="setup-label">Start the countdown for this battle</div>
      <div class="dur-row">
        <button class="btn btn-sm btn-gold" data-action="start" data-battle="${i}" data-hours="24">1 day</button>
        <button class="btn btn-sm btn-gold" data-action="start" data-battle="${i}" data-hours="48">2 days</button>
        <button class="btn btn-sm btn-gold" data-action="start" data-battle="${i}" data-hours="96">4 days</button>
        <button class="btn btn-sm btn-gold" data-action="start" data-battle="${i}" data-hours="144">6 days</button>
        <input class="dur-input" type="number" min="1" placeholder="hrs" id="custom-hrs-${i}">
        <button class="btn btn-sm" data-action="start-custom" data-battle="${i}">Set</button>
      </div>
    </div>
  `;
}

function cardHtml(i){
  const b = battles[i];
  const status = battleStatus(b);
  const statusTag = status === 'setup'
    ? '<span class="tag tag-setup">Setup</span>'
    : status === 'live'
      ? '<span class="tag tag-live">Live</span>'
      : '<span class="tag tag-ended">Ended</span>';

  const titleHtml = isAdmin
    ? `<input class="title-input" value="${escapeAttr(b.title)}" data-field="title" data-battle="${i}">`
    : `<h2 class="card-title">${escapeHtml(b.title)}</h2>`;

  let body = '';
  if(status === 'ended'){
    body = crownedBlock(b);
  } else {
    body = `<div class="duel">${sideBlock(i,'a',b,status)}<div class="vs-badge">VS</div>${sideBlock(i,'b',b,status)}</div>`;
    if(status === 'setup' && isAdmin){
      body += setupControls(i);
    }
  }

  const adminResetBtn = isAdmin && status !== 'setup'
    ? `<button class="btn btn-sm btn-crimson" data-action="reset" data-battle="${i}">Reset</button>`
    : '';

  const countdownText = status === 'live'
    ? 'Ends in ' + fmtCountdown(b.endTime - Date.now())
    : status === 'ended' ? 'Voting closed' : 'Not started yet';

  return `
    <div class="card" data-card="${i}">
      <div class="card-head">
        <div class="title-row">
          <div>
            <div class="eyebrow">Battle 0${i+1}</div>
            ${titleHtml}
          </div>
        </div>
        ${statusTag}
      </div>
      ${body}
      <div class="status-strip">
        <span class="countdown" id="cd-${i}">${countdownText}</span>
        ${adminResetBtn}
      </div>
    </div>
  `;
}

function updateCard(i){
  const el = document.querySelector('[data-card="'+i+'"]');
  if(!el) return;
  const temp = document.createElement('div');
  temp.innerHTML = cardHtml(i);
  el.replaceWith(temp.firstElementChild);
}

function renderAll(){
  const app = document.getElementById('app');
  app.innerHTML = battles.map((_,i)=>cardHtml(i)).join('');
  document.getElementById('adminPillWrap').innerHTML = isAdmin
    ? '<div class="admin-pill">✏️ Admin mode — edit names, photos & timers</div>' : '';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

// ---- event delegation ----
document.getElementById('adminToggle').addEventListener('click', ()=>{
  if(isAdmin){
    isAdmin = false;
    document.getElementById('adminToggle').textContent = '🔒 Admin';
    renderAll();
    return;
  }
  const pw = prompt('Admin password:');
  if(pw === ADMIN_PASSWORD){
    isAdmin = true;
    document.getElementById('adminToggle').textContent = '🔓 Exit admin';
    renderAll();
    showToast('Admin mode on');
  } else if(pw !== null){
    showToast('Wrong password');
  }
});

document.getElementById('app').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const i = parseInt(btn.dataset.battle, 10);
  const b = battles[i];

  if(action === 'vote'){
    if(votedMap[i]) return;
    const side = btn.dataset.side;
    // refresh latest counts first to reduce clobbering
    const latest = await sGet('battle_'+i, true);
    if(latest) battles[i] = latest;
    battles[i][side].votes += 1;
    votedMap[i] = side;
    await sSet('battle_'+i, battles[i], true);
    await sSet('voted_'+i, side, false);
    updateCard(i);
    showToast('Vote counted!');
  }

  if(action === 'start'){
    const hours = parseFloat(btn.dataset.hours);
    b.endTime = Date.now() + hours*3600*1000;
    await sSet('battle_'+i, b, true);
    updateCard(i);
    showToast('Battle started — good luck!');
  }

  if(action === 'start-custom'){
    const inp = document.getElementById('custom-hrs-'+i);
    const hours = parseFloat(inp.value);
    if(!hours || hours <= 0){ showToast('Enter hours first'); return; }
    b.endTime = Date.now() + hours*3600*1000;
    await sSet('battle_'+i, b, true);
    updateCard(i);
    showToast('Battle started — good luck!');
  }

  if(action === 'reset'){
    if(!confirm('Reset votes and timer for this battle?')) return;
    battles[i] = { ...defaultBattle(i), title: b.title, a:{...b.a, votes:0}, b:{...b.b, votes:0} };
    await sSet('battle_'+i, battles[i], true);
    // note: this device's own vote lock also clears so admin can re-test
    votedMap[i] = null;
    await sSet('voted_'+i, null, false);
    updateCard(i);
    showToast('Battle reset');
  }
});

document.getElementById('app').addEventListener('change', async (e)=>{
  const fileInput = e.target.closest('[data-action="upload"]');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const i = parseInt(fileInput.dataset.battle, 10);
    const side = fileInput.dataset.side;
    showToast('Uploading photo…');
    try{
      const dataUrl = await resizeImageFile(fileInput.files[0], 480);
      battles[i][side].image = dataUrl;
      await sSet('battle_'+i, battles[i], true);
      updateCard(i);
      showToast('Photo added');
    }catch(err){
      showToast('Could not read that image');
    }
  }
});

// text field edits: update memory live, persist on blur
document.getElementById('app').addEventListener('input', (e)=>{
  const t = e.target;
  if(!t.dataset.field) return;
  const i = parseInt(t.dataset.battle, 10);
  const field = t.dataset.field;
  const side = t.dataset.side;
  if(field === 'title'){
    battles[i].title = t.value;
  } else {
    battles[i][side][field] = t.value;
  }
});
document.getElementById('app').addEventListener('blur', async (e)=>{
  const t = e.target;
  if(!t.dataset.field) return;
  const i = parseInt(t.dataset.battle, 10);
  await sSet('battle_'+i, battles[i], true);
}, true);

init();
</script>
</body>
</html>
